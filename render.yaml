services:
  - type: web
    name: rjvector
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: RAJ JADHAV
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
